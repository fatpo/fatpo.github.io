<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
    <meta name="description" content="Description">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
    <link rel="stylesheet" href="//unpkg.com/gitalk/dist/gitalk.css">

    <link rel="shortcut icon" href="hema.ico" type="image/x-icon">
    <link rel="icon" href="hema.ico" type="image/x-icon">
    <style>
        /* 侧边栏默认全部折叠 */
        .sidebar-nav li > ul {
            display: none;
        }
        .sidebar-nav li.open > ul {
            display: block;
        }
        /* 有子菜单的 li 显示可点击的小三角 */
        .sidebar-nav li.has-sub > a:after,
        .sidebar-nav li.has-sub > p:after {
            content: '▸';
            float: right;
            transition: transform 0.2s;
        }
        .sidebar-nav li.open.has-sub > a:after,
        .sidebar-nav li.open.has-sub > p:after {
            transform: rotate(90deg);
        }
    </style>
</head>



<body>
<div id="app"></div>


<script>
    window.$docsify = {
        name: '言念君子温其如玉',
        repo: 'https://github.com/fatpo',  //开启github图标
        loadSidebar: true,
        subMaxLevel: 0,        // 不限制层级，全部显示
        autoHeader: true, // 自动给文章加一个title，名字就是文件名
        homepage: 'README.md',
        showLevel: false,
        toc: {
            tocMaxLevel: 6,
            target: 'h1, h2, h3, h4, h5, h6'
        },
        copyCode: {
            buttonText: 'Copy to clipboard',
            errorText: 'Error',
            successText: 'Copied'
        },
        scrollToTop: {
            auto: true,
            text: 'Top',
            right: 15,
            bottom: 15,
            offset: 300
        },
        search: {
            paths: 'auto',
            placeholder: '搜索',
            noData: '找不到结果',
            depth: 3,
        },
        count: {
            countable: true,
            fontsize: '0.9em',
            color: 'rgb(90,90,90)',
            language: 'chinese'
        },
        // ======= 侧边栏独立折叠（无手风琴） =======
        plugins: [
            function(hook, vm) {
                hook.doneEach(function() {
                    initSidebarCollapse();
                });
            }
        ]
    }

</script>

<!-- 侧边栏折叠（自定义，独立展开/折叠，无手风琴效果） -->
<script>
function initSidebarCollapse() {
    var sidebar = document.querySelector('.sidebar-nav');
    if (!sidebar) return;

    var allLis = sidebar.querySelectorAll('li');
    allLis.forEach(function(li) {
        // 跳过已处理的
        if (li.dataset.sidebarInited) return;
        li.dataset.sidebarInited = '1';

        // 检查是否有直接子 ul
        var children = li.children;
        var hasUl = false;
        for (var i = 0; i < children.length; i++) {
            if (children[i].tagName === 'UL') {
                hasUl = true;
                break;
            }
        }
        if (!hasUl) return;

        li.classList.add('has-sub');

        // 给 li 本身绑定点击（而非 a 标签，避免阻止导航）
        li.addEventListener('click', function(e) {
            // 如果点的是 a 标签里的链接，让 docsify 正常导航
            if (e.target.tagName === 'A' && e.target.getAttribute('href')) {
                // 同时展开当前目录
                this.classList.add('open');
                return;
            }
            // 点击空白区域或标题文字，只切换折叠
            this.classList.toggle('open');
            e.stopPropagation();
        });
    });
}
</script>

<!-- 代码复制 -->
<script src="//unpkg.com/docsify-copy-code@2.1.1/dist/docsify-copy-code.min.js"></script>

<!-- 回到顶部 -->
<script src="//unpkg.com/docsify-scroll-to-top/dist/docsify-scroll-to-top.min.js"></script>

<!-- 图片缩放 -->
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>

<!-- 搜索 -->
<script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>

<!-- 字数统计 -->
<script src="//unpkg.com/docsify-count/dist/countable.js"></script>

<!-- Docsify v4 -->
<script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
<script src="https://unpkg.com/docsify-plugin-toc@1.2.1/dist/docsify-plugin-toc.min.js"></script>

<!--<script src="docsify-toc-min.js"></script>-->
<script src="md5.min.js"></script>

</body>
</html>
